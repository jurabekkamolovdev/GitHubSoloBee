networks:
  solobee_net:
    driver: bridge

volumes:
  pgdata:
  minio_data:

services:
  postgres:
    image: postgres:15-alpine
    container_name: solobee_postgres
    env_file: .env
    environment:
      POSTGRES_USER:  ${DB_USERNAME}
      POSTGRES_PASSWORD:  ${DB_PASSWORD}
      POSTGRES_DB:  ${DB_NAME}
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - solobee_net
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: solobee_api
    env_file: .env
    ports:
      - "3000:3000"
    depends_on:
      - postgres
      - minio
    networks:
      - solobee_net
    restart: unless-stopped

  kindergarten-admin:
    build:
      context: ../solobee-kindergarten-admin
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${KINDERGARTEN_ADMIN_API_URL:-https://api.solobee.uz}
    container_name: solobee_kindergarten_admin
    ports:
      - "8080:80"
    depends_on:
      - api
    networks:
      - solobee_net
    restart: unless-stopped
  
  super-admin:
    build:
      context: ../solobee-admin
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${SUPER_ADMIN_API_URL:-https://api.solobee.uz}
    container_name: solobee_admin
    ports:
      - "8081:80"
    depends_on:
      - api
    networks:
      - solobee_net
    restart: unless-stopped

  minio:
    image: minio/minio
    container_name: solobee_minio
    env_file: .env
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY}
      MINIO_SERVER_URL: https://s3.solobee.uz
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    networks:
      - solobee_net
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: solobee_nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ../nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ../certbot/conf:/etc/letsencrypt:ro
      - ../certbot/www:/var/www/certbot:ro
    depends_on:
      - api
      - super-admin
      - kindergarten-admin
      - solobee-landing
      - minio
    networks:
      - solobee_net
    restart: unless-stopped

  solobee-landing:
    build:
      context: ../solobee-landing
      dockerfile: Dockerfile
    container_name: solobee_landing
    networks:
      - solobee_net
    restart: unless-stopped
    
  certbot:
    image: certbot/certbot
    container_name: solobee_certbot
    volumes:
      - ../certbot/conf:/etc/letsencrypt
      - ../certbot/www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot --quiet; sleep 12h & wait $${!}; done;'"
    restart: unless-stopped
