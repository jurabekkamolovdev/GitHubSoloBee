##############################################################
# HTTPS — s3.solobee.uz (MinIO S3 API)
#
# Used for presigned upload/download URLs. The mobile app and
# admin panels upload files directly to this endpoint via
# pre-signed URLs that the API issues.
##############################################################
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name s3.solobee.uz;

    ssl_certificate     /etc/letsencrypt/live/solobee.uz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/solobee.uz/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    resolver 127.0.0.11 valid=10s ipv6=off;

    # MinIO needs:
    #  - large body sizes for uploads
    #  - unmodified headers (signature validation depends on Host)
    #  - no buffering for streaming uploads
    client_max_body_size 0;
    ignore_invalid_headers off;
    proxy_buffering off;
    proxy_request_buffering off;

    # Long timeouts for big uploads
    proxy_connect_timeout 300s;
    proxy_send_timeout    300s;
    proxy_read_timeout    300s;

    location / {
        set $upstream_minio minio;
        proxy_pass         http://$upstream_minio:9000;
        proxy_http_version 1.1;

        # CRITICAL: pass the original Host so MinIO's signature check passes
        proxy_set_header   Host              $http_host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        proxy_set_header   Connection        "";
    }
}
