##############################################################
# Savodxon — Nginx reverse proxy config (with domains + SSL)
#
# Domains:
#   solobee.uz          → Landing website
#   www.solobee.uz      → Landing website (redirect to apex)
#   api.solobee.uz      → NestJS API + Swagger
#   admin.solobee.uz    → Super Admin Panel (content creators)
#   vendor.solobee.uz   → Kindergarten Admin Panel
#   s3.solobee.uz       → MinIO S3 API (presigned upload/download URLs)
#
# SSL certificates (Let's Encrypt) are mounted from host:
#   /etc/letsencrypt → /etc/letsencrypt (read-only)
#
# ACME HTTP-01 challenge:
#   /.well-known/acme-challenge/ is served from /var/www/certbot
##############################################################

# ── Upstream resolver for Docker internal DNS ──────────────
# (Docker re-resolves container IPs at runtime so nginx survives container restarts)

##############################################################
# HTTP (port 80) — ACME challenge + redirect to HTTPS
##############################################################
server {
    listen 80;
    listen [::]:80;
    server_name solobee.uz www.solobee.uz api.solobee.uz admin.solobee.uz vendor.solobee.uz s3.solobee.uz;

    # Let's Encrypt HTTP-01 challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Everything else → HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

##############################################################
# HTTPS — solobee.uz (landing)
##############################################################
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name solobee.uz;

    ssl_certificate     /etc/letsencrypt/live/solobee.uz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/solobee.uz/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    resolver 127.0.0.11 valid=10s ipv6=off;

    location / {
        set $upstream_solobee solobee-landing;
        proxy_pass         http://$upstream_solobee:80;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # SPA fallback
        proxy_intercept_errors on;
        error_page 404 /index.html;
    }
}

##############################################################
# HTTPS — www.solobee.uz → redirect to apex
##############################################################
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.solobee.uz;

    ssl_certificate     /etc/letsencrypt/live/solobee.uz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/solobee.uz/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://solobee.uz$request_uri;
}

##############################################################
# HTTPS — api.solobee.uz (NestJS API + Swagger)
##############################################################
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name api.solobee.uz;

    ssl_certificate     /etc/letsencrypt/live/solobee.uz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/solobee.uz/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    resolver 127.0.0.11 valid=10s ipv6=off;

    # File uploads (storage presigned endpoints)
    client_max_body_size 50M;

    location / {
        set $upstream_api api;
        proxy_pass         http://$upstream_api:3000;
        proxy_http_version 1.1;

        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # WebSocket support
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";

        # Timeouts
        proxy_read_timeout  60s;
        proxy_send_timeout  60s;
    }
}

##############################################################
# HTTPS — admin.solobee.uz (Super Admin / Content Creators)
##############################################################
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name admin.solobee.uz;

    ssl_certificate     /etc/letsencrypt/live/solobee.uz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/solobee.uz/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    resolver 127.0.0.11 valid=10s ipv6=off;

    location / {
        set $upstream_super_admin super-admin;
        proxy_pass         http://$upstream_super_admin:80;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        proxy_intercept_errors on;
        error_page 404 /index.html;
    }
}

##############################################################
# HTTPS — vendor.solobee.uz (Kindergarten Admins)
##############################################################
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name vendor.solobee.uz;

    ssl_certificate     /etc/letsencrypt/live/solobee.uz/fullchain.pem;
