##############################################################
# Bootstrap nginx config — HTTP only.
#
# Use this BEFORE issuing Let's Encrypt certificates.
# After certbot issues certs, switch to nginx.conf (HTTPS).
#
# Steps:
#   1. docker compose up -d   (with this config mounted)
#   2. Run certbot to obtain certs
#   3. Swap config to nginx.conf and reload nginx
##############################################################

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name solobee.uz www.solobee.uz api.solobee.uz admin.solobee.uz vendor.solobee.uz s3.solobee.uz;

    # Let's Encrypt HTTP-01 challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Health check / placeholder
    location / {
        return 200 'Bootstrap mode — waiting for SSL certificates.\n';
        add_header Content-Type text/plain;
    }
}
